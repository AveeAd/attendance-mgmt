name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Cross-compile all targets
        working-directory: backend
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p ../dist-raw
          declare -A targets=(
            [windows/amd64]=".exe"
            [darwin/amd64]=""
            [darwin/arm64]=""
            [linux/amd64]=""
            [linux/arm64]=""
          )
          for target in "${!targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext="${targets[$target]}"
            out="../dist-raw/attendance-mgmt-${goos}-${goarch}${ext}"
            echo "Building $out"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -ldflags "-X attendance-mgmt/backend/internal/version.Version=${VERSION}" \
              -o "$out" .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: raw-binaries
          path: dist-raw/

  package-windows:
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: raw-binaries
          path: dist-raw

      - name: Install NSIS and zip
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      - name: Build installer
        run: |
          cp dist-raw/attendance-mgmt-windows-amd64.exe installer/windows/attendance-mgmt.exe
          makensis -DVERSION="${GITHUB_REF_NAME}" installer/windows/attendance-mgmt.nsi

      - name: Build updater asset (zip)
        run: |
          mkdir -p out
          cp dist-raw/attendance-mgmt-windows-amd64.exe attendance-mgmt.exe
          zip out/attendance-mgmt_windows_amd64.exe.zip attendance-mgmt.exe
          mv installer/windows/attendance-mgmt-windows-amd64-setup.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: out/

  package-linux:
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: raw-binaries
          path: dist-raw

      - name: Install nfpm
        run: |
          tag=$(curl -sSf https://api.github.com/repos/goreleaser/nfpm/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          ver="${tag#v}"
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/${tag}/nfpm_${ver}_amd64.deb" -o /tmp/nfpm.deb
          sudo apt-get install -y /tmp/nfpm.deb

      - name: Build packages
        run: |
          mkdir -p out
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            cp "dist-raw/attendance-mgmt-linux-${arch}" installer/linux/attendance-mgmt
            chmod +x installer/linux/attendance-mgmt

            # nfpm resolves `src:` paths in nfpm.yaml relative to the
            # invoking cwd, not the config file's directory — must cd in.
            (cd installer/linux && ARCH="$arch" VERSION="$version" nfpm package \
              --config nfpm.yaml \
              --packager deb \
              --target "../../out/attendance-mgmt_linux_${arch}.deb")
            (cd installer/linux && ARCH="$arch" VERSION="$version" nfpm package \
              --config nfpm.yaml \
              --packager rpm \
              --target "../../out/attendance-mgmt_linux_${arch}.rpm")

            tar czf "out/attendance-mgmt_linux_${arch}.tar.gz" -C installer/linux attendance-mgmt
            rm installer/linux/attendance-mgmt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: out/

  package-macos:
    runs-on: macos-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: raw-binaries
          path: dist-raw

      - name: Build packages
        run: |
          mkdir -p out
          for arch in amd64 arm64; do
            payload="/tmp/payload-${arch}/usr/local/attendance-mgmt"
            mkdir -p "$payload"
            cp "dist-raw/attendance-mgmt-darwin-${arch}" "$payload/attendance-mgmt"
            chmod +x "$payload/attendance-mgmt"
            cp installer/macos/com.attendance-mgmt.app.plist "$payload/"

            pkgbuild --root "/tmp/payload-${arch}" \
              --scripts installer/macos/scripts \
              --identifier com.attendance-mgmt.app \
              --version "${GITHUB_REF_NAME#v}" \
              --install-location / \
              "out/attendance-mgmt-macos-${arch}.pkg"

            tar czf "out/attendance-mgmt_darwin_${arch}.tar.gz" -C "$payload" attendance-mgmt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: out/

  publish-release:
    runs-on: ubuntu-latest
    needs: [package-windows, package-linux, package-macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-assets"
          path: release-assets
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
